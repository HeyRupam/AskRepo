spring.application.name=backend

# -------------------
# Local secrets
# -------------------
# Loads the git-ignored .env at the repo root as a properties file.
# optional: => absent file is fine (CI / prod supply real env vars instead).
# Two paths so it resolves whether the app is started from the repo root
# or from backend/backend. Real environment variables take precedence.
spring.config.import=optional:file:./.env[.properties],optional:file:../../.env[.properties]

# -------------------
# Database
# -------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/askrepo}
spring.datasource.username=${DB_USERNAME:askrepo}
spring.datasource.password=${DB_PASSWORD}

# -------------------
# JPA / Hibernate
# -------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.fromat_sql=true
spring.jpa.open-in-view=false


# -------------------
# OpenAI
# --------------------
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.embedding.model=text-embedding-3-small

# --------------------
# GitHub OAuth2
# --------------------
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

# --------------------
# Session
# --------------------
server.servlet.session.cookie.name=ASKREPO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# --------------------
# App settings
# --------------------
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000,http://localhost:5173}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT}
# --------------------
# Indexing
# --------------------
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.gihub.api-delay-ms=50